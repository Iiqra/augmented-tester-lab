name: lab
on: [push, pull_request]
jobs:
  chapter-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run ch1:coverage
      - run: npm run ch1:check-endpoints
      - run: npm run test:mock
