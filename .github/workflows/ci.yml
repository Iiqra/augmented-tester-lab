name: lab
on: [push, pull_request]
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ch1:coverage
  # UI flows need an iOS simulator with the twodos build installed.
  # Run them locally with `npm run flows` (see docs/setup-ios.md).
